server {
    listen 443 ssl http2;
    server_name certservers.example.invalid;

    ssl_certificate     /etc/ssl/certs/certservers-web.pem;
    ssl_certificate_key /etc/ssl/private/certservers-web.key;

    root /var/www/certservers;
    index index.html;

    location /api/v1/ {
        proxy_pass http://unix:/run/certservers/api.sock:;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
